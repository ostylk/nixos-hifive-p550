name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false

      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build .#nixos (cross-compiled for riscv64)
        run: nix build .#nixos -L --print-build-logs

      - name: Stage image for release
        run: cp result/nixos.img.xz "nixos-${{ inputs.tag }}.img.xz"

      - name: Build .#bootchain (cross-compiled for riscv64)
        run: nix build .#bootchain -L --print-build-logs

      - name: Stage bootchain for release
        run: cp result/bootloader_ddr5_secboot.bin bootloader_ddr5_secboot.bin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            nixos-${{ inputs.tag }}.img.xz
            bootloader_ddr5_secboot.bin
